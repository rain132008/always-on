[project]
name = "sdd-always-on"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "croniter>=6,<7",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "psutil>=6,<8",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["openai_live: 显式启用后调用 OpenAI API"]
